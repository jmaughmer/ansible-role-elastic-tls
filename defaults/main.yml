---
# --- Provider --------------------------------------------------------------

# Where certificates come from:
#   ca           a private CA this role creates and keeps on elastic_tls_ca_host
#   letsencrypt  an ACME CA such as Let's Encrypt (server certificates only)
elastic_tls_provider: ca

# --- Certificates for this host --------------------------------------------

# Certificates to issue for this host. Each entry:
#   name   entry name in elastic_tls_ssl_certificates and file name on the host
#          (default: inventory_hostname)
#   dns    DNS subjectAltNames (default: elastic_tls_default_dns)
#   ip     IP subjectAltNames (default: elastic_tls_default_ip with the ca
#          provider, none with letsencrypt)
#   usage  any of server, client (default: [server, client] with the ca
#          provider, [server] with letsencrypt). Elasticsearch transport TLS
#          needs both.
#   days   validity in days, ca provider only (default: elastic_tls_cert_days)
# Set to [] on hosts that only need the CA certificate.
elastic_tls_certificates:
  - name: "{{ inventory_hostname }}"

# DNS subjectAltNames used when an entry has no dns list: the inventory name,
# FQDN and short hostname, without IP addresses.
elastic_tls_default_dns: >-
  {{ [inventory_hostname,
      ansible_facts['fqdn'] | default(''),
      ansible_facts['hostname'] | default('')]
     | select
     | reject('match', '^[0-9.]+$')
     | reject('search', ':')
     | unique
     | list }}

# IP subjectAltNames used when an entry has no ip list: the default IPv4
# address, and the inventory name when it is an IPv4 address.
elastic_tls_default_ip: >-
  {{ ([ansible_facts['default_ipv4']['address'] | default('')]
      + ([inventory_hostname] if inventory_hostname is match('^[0-9]+(\.[0-9]+){3}$') else []))
     | select
     | unique
     | list }}

# Directory on each host for its certificates (certs/) and keys (private/).
# Consumer roles copy from here into their own directories, so keep it outside
# /etc/elasticsearch, /etc/kibana and the like.
elastic_tls_dir: /etc/pki/elastic-tls

# Private key algorithm for host certificates: RSA or ECC.
elastic_tls_key_type: RSA
# Key size for RSA keys.
elastic_tls_key_size: 2048
# Curve for ECC keys.
elastic_tls_key_curve: secp256r1

# Validity of each host certificate, in days (ca provider).
elastic_tls_cert_days: 1095

# Reissue a certificate when it expires within this many days.
elastic_tls_renew_before_days: 30

# Install the CA certificate on hosts without certificates of their own, so it
# can be used as a trust anchor there.
elastic_tls_install_ca: true

# Packages that give the Python interpreter on the targets and the CA host the
# cryptography library community.crypto needs. Change this when
# ansible_python_interpreter is not the platform python.
elastic_tls_packages:
  - python3-cryptography

# --- Private CA (elastic_tls_provider: ca) ---------------------------------

# Inventory host that keeps the CA key and signs certificates. It does not have
# to be in the play, and does not need any Elastic package.
elastic_tls_ca_host: "{{ (groups['elasticsearch'] | default(ansible_play_hosts_all, true))[0] }}"

# Directory on the CA host for the CA.
elastic_tls_ca_dir: /etc/elastic-tls
elastic_tls_ca_certificate_path: "{{ elastic_tls_ca_dir }}/ca/ca.crt"
elastic_tls_ca_privatekey_path: "{{ elastic_tls_ca_dir }}/ca/ca.key"

# Subject common name of a new CA. An existing CA is never replaced.
elastic_tls_ca_common_name: Elastic Stack CA

# Passphrase for the CA private key. Store it in Ansible Vault. An empty value
# leaves the key unencrypted.
elastic_tls_ca_passphrase: ""

# Validity of a new CA certificate, in days.
elastic_tls_ca_days: 3650

# RSA key size of a new CA key.
elastic_tls_ca_key_size: 4096

# Path on the Ansible controller to save a copy of the CA certificate to.
# Leave empty to skip.
elastic_tls_fetch_ca_cert: ""

# --- ACME (elastic_tls_provider: letsencrypt) ------------------------------

elastic_tls_acme_directory: https://acme-v02.api.letsencrypt.org/directory
# Contact address for the ACME account, for example admin@example.com.
elastic_tls_acme_email: ""
# Must be set to true to accept the CA's terms of service.
elastic_tls_acme_terms_agreed: false
# http-01 or dns-01.
elastic_tls_acme_challenge: http-01
# http-01: directory a web server on port 80 of this host serves as
# http://<name>/ ; challenge files are written below .well-known/acme-challenge.
elastic_tls_acme_webroot: /var/www/html
# dns-01: a tasks file of yours that creates the TXT records. It is included
# with elastic_tls_acme_dns_records ({fqdn: [values]}) and
# elastic_tls_acme_dns_state: present, and
# again with elastic_tls_acme_dns_state: absent afterwards.
elastic_tls_acme_dns_tasks: ""
# CA bundle published as each entry's ca. ACME certificates chain to a public
# root, so this is the system trust store.
elastic_tls_acme_ca_path: /etc/pki/tls/certs/ca-bundle.crt
