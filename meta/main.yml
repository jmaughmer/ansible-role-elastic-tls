---
galaxy_info:
  role_name: elastic_tls
  namespace: jmaughmer
  author: Justin Maughmer
  description: >-
    Issue TLS certificates for the Elastic Stack from a private CA or Let's
    Encrypt and publish them as elastic_tls_ssl_certificates for the
    elasticsearch, kibana, logstash and elastic_fleet roles.
  license: MIT
  min_ansible_version: "2.15"
  platforms:
    # EL: RHEL, AlmaLinux and Rocky Linux
    - name: EL
      versions:
        - "9"
        - "10"
  galaxy_tags:
    - elastic
    - elasticsearch
    - kibana
    - logstash
    - tls
    - ssl
    - certificates
    - security

dependencies: []
