---
# Three containers on one network, all in the play. The playbooks find them by
# group, and every scenario names its hosts and network after itself, so
# scenarios can run at the same time.
#   tls-default-es      group elasticsearch, so it is the CA host; default
#                       certificate
#   tls-default-kb      group kibana: two certificates, one of them
#                       server-only with an extra name
#   tls-default-client  group clients: no certificates, only the CA
#                       certificate
# MOLECULE_EL picks the AlmaLinux release of the almalinux/<release>-init
# image (default 9; also 10). Nothing Elastic is installed: the role must work
# on a bare host, before the elasticsearch role has run. Ansible connects as
# root, so the playbooks do not use become: the images have no sudo.
role_name_check: 1

dependency:
  name: galaxy   # installs requirements.yml next to this file

driver:
  name: podman

platforms:
  - name: tls-default-es
    image: "docker.io/almalinux/${MOLECULE_EL:-9}-init:latest"
    pre_build_image: true
    override_command: false   # keep the image's own CMD: systemd as PID 1
    systemd: always
    network: elastic_tls_default
    groups: [elasticsearch]

  - name: tls-default-kb
    image: "docker.io/almalinux/${MOLECULE_EL:-9}-init:latest"
    pre_build_image: true
    override_command: false
    systemd: always
    network: elastic_tls_default
    groups: [kibana]

  - name: tls-default-client
    image: "docker.io/almalinux/${MOLECULE_EL:-9}-init:latest"
    pre_build_image: true
    override_command: false
    systemd: always
    network: elastic_tls_default
    groups: [clients]

provisioner:
  name: ansible
  inventory:
    links:
      group_vars: inventory/group_vars/

verifier:
  name: ansible

scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - check
    - verify
    - destroy
