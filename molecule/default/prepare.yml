---
# verify.yml inspects the files with the openssl command, which the
# rockylinux10 image lacks. The role itself does not need it.
- name: Prepare
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Read the distribution
      ansible.builtin.setup:
        gather_subset: [min]

    - name: Install openssl for verify.yml
      ansible.builtin.package:
        name: openssl
        state: present
