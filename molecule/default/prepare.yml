---
# The test images lack two packages a real host has:
#   - iproute (iproute2 on Ubuntu): without it there are no network facts, so
#     no IP address among the default certificate names;
#   - openssl (AlmaLinux 10): verify.yml inspects the files with it. The role
#     itself does not need it.
- name: Prepare
  hosts: all
  gather_facts: false
  tasks:
    - name: Read the distribution
      ansible.builtin.setup:
        gather_subset: [min]

    - name: Install iproute and openssl
      ansible.builtin.package:
        name:
          - "{{ 'iproute2' if ansible_facts['os_family'] == 'Debian' else 'iproute' }}"
          - openssl
        state: present
