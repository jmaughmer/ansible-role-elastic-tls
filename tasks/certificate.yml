---
# Issues this host's certificate on the CA host. A spec file records the
# requested name, SANs and validity; when it changes, the certificate is reissued.

- name: Record the certificate request
  ansible.builtin.copy:
    content: |
      {{ {'name': elastic_tls_cert_name,
          'dns': elastic_tls_cert_dns,
          'ip': elastic_tls_cert_ip,
          'days': elastic_tls_cert_days | int} | to_nice_json }}
    dest: "{{ elastic_tls_ca_dir }}/specs/{{ elastic_tls_cert_name }}.json"
    owner: root
    group: root
    mode: "0600"
  register: elastic_tls_cert_spec
  delegate_to: "{{ elastic_tls_ca_host }}"

- name: Remove the outdated certificate bundle
  ansible.builtin.file:
    path: "{{ elastic_tls_ca_dir }}/certs/{{ elastic_tls_cert_name }}.zip"
    state: absent
  when: elastic_tls_cert_spec is changed or elastic_tls_cert_regenerate | bool
  delegate_to: "{{ elastic_tls_ca_host }}"

- name: Generate the host certificate
  ansible.builtin.command:
    argv: >-
      {{ [elastic_tls_certutil, 'cert', '--silent', '--pem',
          '--ca-cert', elastic_tls_ca_dir ~ '/ca/ca.crt',
          '--ca-key', elastic_tls_ca_dir ~ '/ca/ca.key',
          '--name', elastic_tls_cert_name,
          '--days', elastic_tls_cert_days | string,
          '--out', elastic_tls_ca_dir ~ '/certs/' ~ elastic_tls_cert_name ~ '.zip']
         + (['--dns', elastic_tls_cert_dns | join(',')] if elastic_tls_cert_dns | length > 0 else [])
         + (['--ip', elastic_tls_cert_ip | join(',')] if elastic_tls_cert_ip | length > 0 else [])
         + (['--ca-pass', elastic_tls_ca_key_password] if elastic_tls_ca_key_password | length > 0 else []) }}
    creates: "{{ elastic_tls_ca_dir }}/certs/{{ elastic_tls_cert_name }}.zip"
  delegate_to: "{{ elastic_tls_ca_host }}"
  no_log: "{{ elastic_tls_ca_key_password | length > 0 }}"

- name: Extract the host certificate
  ansible.builtin.unarchive:
    src: "{{ elastic_tls_ca_dir }}/certs/{{ elastic_tls_cert_name }}.zip"
    dest: "{{ elastic_tls_ca_dir }}/certs"
    remote_src: true
    owner: root
    group: root
    mode: "u=rwX,go="
  delegate_to: "{{ elastic_tls_ca_host }}"

- name: Read the host certificate
  ansible.builtin.slurp:
    src: "{{ elastic_tls_ca_dir }}/certs/{{ elastic_tls_cert_name }}/{{ elastic_tls_cert_name }}.crt"
  register: elastic_tls_host_cert
  delegate_to: "{{ elastic_tls_ca_host }}"

- name: Read the host private key
  ansible.builtin.slurp:
    src: "{{ elastic_tls_ca_dir }}/certs/{{ elastic_tls_cert_name }}/{{ elastic_tls_cert_name }}.key"
  register: elastic_tls_host_key
  delegate_to: "{{ elastic_tls_ca_host }}"
  no_log: true
