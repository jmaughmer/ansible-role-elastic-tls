---
- name: Create the certificate directory for {{ elastic_tls_component }}
  ansible.builtin.file:
    path: "{{ elastic_tls_settings.cert_dir }}"
    state: directory
    owner: "{{ elastic_tls_settings.owner }}"
    group: "{{ elastic_tls_settings.group }}"
    mode: "0750"
  vars:
    elastic_tls_settings: "{{ elastic_tls_component_settings[elastic_tls_component] }}"

- name: Install the CA certificate for {{ elastic_tls_component }}
  ansible.builtin.copy:
    content: "{{ elastic_tls_ca_cert.content | b64decode }}"
    dest: "{{ elastic_tls_settings.cert_dir }}/{{ elastic_tls_ca_cert_filename }}"
    owner: "{{ elastic_tls_settings.owner }}"
    group: "{{ elastic_tls_settings.group }}"
    mode: "0644"
  vars:
    elastic_tls_settings: "{{ elastic_tls_component_settings[elastic_tls_component] }}"
  notify: elastic_tls restart services

- name: Install the host certificate for {{ elastic_tls_component }}
  ansible.builtin.copy:
    content: "{{ elastic_tls_host_cert.content | b64decode }}"
    dest: "{{ elastic_tls_settings.cert_dir }}/{{ elastic_tls_cert_filename }}"
    owner: "{{ elastic_tls_settings.owner }}"
    group: "{{ elastic_tls_settings.group }}"
    mode: "0644"
  vars:
    elastic_tls_settings: "{{ elastic_tls_component_settings[elastic_tls_component] }}"
  notify: elastic_tls restart services

- name: Install the host private key for {{ elastic_tls_component }}
  ansible.builtin.copy:
    content: "{{ elastic_tls_host_key.content | b64decode }}"
    dest: "{{ elastic_tls_settings.cert_dir }}/{{ elastic_tls_key_filename }}"
    owner: "{{ elastic_tls_settings.owner }}"
    group: "{{ elastic_tls_settings.group }}"
    mode: "0640"
  vars:
    elastic_tls_settings: "{{ elastic_tls_component_settings[elastic_tls_component] }}"
  notify: elastic_tls restart services
  no_log: true
