---
- name: Remove auto-configured TLS settings from elasticsearch.yml
  # Security auto-configuration writes nested xpack.security.{http,transport}.ssl
  # maps that point at PKCS#12 keystores. The rest of its block (http.host,
  # cluster.initial_master_nodes, ...) is left alone.
  ansible.builtin.replace:
    path: "{{ elastic_tls_elasticsearch_config }}"
    regexp: '^xpack\.security\.(?:http|transport)\.ssl:[ \t]*\n(?:[ \t]+\S.*\n?)*'
    replace: ""
  when: elastic_tls_elasticsearch_remove_autoconfig | bool
  notify: elastic_tls restart services

- name: List Elasticsearch keystore entries
  ansible.builtin.command:
    argv:
      - "{{ elastic_tls_elasticsearch_keystore }}"
      - list
  register: elastic_tls_es_keystore
  changed_when: false
  when: elastic_tls_elasticsearch_remove_autoconfig | bool

- name: Remove auto-configured keystore passwords
  ansible.builtin.command:
    argv:
      - "{{ elastic_tls_elasticsearch_keystore }}"
      - remove
      - "{{ item }}"
  loop: >-
    {{ elastic_tls_es_keystore.stdout_lines
       | select('match', '^xpack\.security\.(http|transport)\.ssl\.(keystore|truststore)\.secure_password$')
       | list }}
  changed_when: true
  when: elastic_tls_elasticsearch_remove_autoconfig | bool
  notify: elastic_tls restart services

- name: Configure TLS in elasticsearch.yml
  ansible.builtin.blockinfile:
    path: "{{ elastic_tls_elasticsearch_config }}"
    marker: "# {mark} ANSIBLE MANAGED BLOCK: elastic_tls"
    block: |
      {% if elastic_tls_elasticsearch_transport_ssl | bool %}
      xpack.security.transport.ssl.enabled: true
      xpack.security.transport.ssl.verification_mode: {{ elastic_tls_elasticsearch_transport_verification_mode }}
      xpack.security.transport.ssl.key: {{ elastic_tls_es_dir }}/{{ elastic_tls_key_filename }}
      xpack.security.transport.ssl.certificate: {{ elastic_tls_es_dir }}/{{ elastic_tls_cert_filename }}
      xpack.security.transport.ssl.certificate_authorities: ["{{ elastic_tls_es_dir }}/{{ elastic_tls_ca_cert_filename }}"]
      {% endif %}
      {% if elastic_tls_elasticsearch_http_ssl | bool %}
      xpack.security.http.ssl.enabled: true
      xpack.security.http.ssl.key: {{ elastic_tls_es_dir }}/{{ elastic_tls_key_filename }}
      xpack.security.http.ssl.certificate: {{ elastic_tls_es_dir }}/{{ elastic_tls_cert_filename }}
      xpack.security.http.ssl.certificate_authorities: ["{{ elastic_tls_es_dir }}/{{ elastic_tls_ca_cert_filename }}"]
      {% endif %}
  vars:
    elastic_tls_es_dir: "{{ elastic_tls_component_settings['elasticsearch'].cert_dir }}"
  notify: elastic_tls restart services
