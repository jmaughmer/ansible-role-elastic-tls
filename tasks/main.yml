---
# Issues certificates and publishes them as elastic_tls_ssl_certificates. The
# role only writes below elastic_tls_dir (and the CA directory on the CA host):
# it does not touch Elastic configuration files and does not restart services.
# The consumer roles copy the files and do their own, health-checked restarts.

- name: Validate settings
  ansible.builtin.import_tasks: validate.yml

# apt needs a package index first, and a fresh Ubuntu image has none.
- name: Install the cryptography library
  ansible.builtin.package:
    name: "{{ elastic_tls_packages }}"
    state: present
  when:
    - elastic_tls_packages | length > 0
    - ansible_facts['os_family'] | default('') != 'Debian'

- name: Install the cryptography library (apt)
  ansible.builtin.apt:
    name: "{{ elastic_tls_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  when:
    - elastic_tls_packages | length > 0
    - ansible_facts['os_family'] | default('') == 'Debian'

- name: Create the certificate directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ elastic_tls_dir }}", mode: "0755"}
    - {path: "{{ elastic_tls_dir }}/certs", mode: "0755"}
    - {path: "{{ elastic_tls_dir }}/private", mode: "0700"}
  loop_control:
    label: "{{ item.path }}"

- name: Issue certificates from the private CA
  ansible.builtin.include_tasks: ca.yml
  when: elastic_tls_provider == 'ca'

- name: Issue certificates from the ACME CA
  ansible.builtin.include_tasks: letsencrypt.yml
  when: elastic_tls_provider == 'letsencrypt'

- name: Publish the issued certificates
  ansible.builtin.set_fact:
    elastic_tls_ssl_certificates: "{{ _elastic_tls_published }}"
